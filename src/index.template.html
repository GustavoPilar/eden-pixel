<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2022">
<title>Biomas e vegetação — pixel art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens: giz e grafite no claro; ardósia e verde de folha no escuro */
  :root {
    --panel: #e8ecea; --panel-2: #d9dfdc; --edge: #aab5b0; --ink: #1c2325; --ink-soft: #52605d;
    --accent: #1f5c55; --accent-ink: #eef6f3; --grass: #6fa84a; --sheet: #cdd5d1;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: #1b2022; --panel-2: #283033; --edge: #3d4a4d; --ink: #e6ebea; --ink-soft: #9fb0ac;
      --accent: #5fb39f; --accent-ink: #0f1a18; --sheet: #2a3335;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: #1b2022; --panel-2: #283033; --edge: #3d4a4d; --ink: #e6ebea; --ink-soft: #9fb0ac;
    --accent: #5fb39f; --accent-ink: #0f1a18; --sheet: #2a3335;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; overscroll-behavior: none; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; overflow: hidden; background: #13222c; color: var(--ink);
    font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.35;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #13222c; }
  #app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #stage { position: relative; min-height: 0; overflow: hidden; background: var(--grass); display: grid; place-items: center; touch-action: none; }
  #scene { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; cursor: pointer; }
  #sheetView { position: absolute; inset: 0; overflow: auto; background: var(--sheet); padding: 12px; }
  #sheetView[hidden] { display: none; }
  #sheetGrid { display: grid; grid-template-columns: 62px repeat(3, auto); gap: 8px 10px; align-items: center; justify-content: center; }
  #sheetGrid .h { color: var(--ink-soft); font-size: 12.5px; text-align: center; }
  #sheetGrid .r { font-size: 12.5px; font-weight: 600; }
  #sheetGrid canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: color-mix(in srgb, var(--panel) 45%, transparent); border-radius: 6px; display: block; }
  #tools { position: absolute; right: 8px; top: 52px; display: flex; gap: 6px; }
  .pill { min-width: 44px; min-height: 44px; padding: 4px 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.28); background: rgba(18, 28, 30, 0.3); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font-weight: 500; opacity: 0.85; transition: opacity 0.15s, background 0.15s; }
  .pill:active { opacity: 1; background: rgba(18, 28, 30, 0.55); }

  #stage { background: #13222c; }
  #loading { position: absolute; inset: 0; display: grid; place-content: center; background: color-mix(in srgb, var(--panel) 80%, transparent); z-index: 5; font-family: "Pixelify Sans", ui-monospace, monospace; font-size: 20px; }
  #loading[hidden] { display: none; }
  #catalogView { position: absolute; inset: 0; overflow: auto; background: var(--sheet); padding: 10px 12px 24px; }
  #catalogView[hidden] { display: none; }
  #catalogView h2 { font-family: "Pixelify Sans", ui-monospace, monospace; font-weight: 600; font-size: 20px; margin: 16px 0 6px; }
  #catalogView .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin: 0 0 8px; }
  #catalogView figure { margin: 0; display: grid; gap: 3px; justify-items: center; }
  #catalogView figcaption { font-size: 12px; color: var(--ink-soft); text-align: center; max-width: 130px; }
  #catalogView canvas { image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 4px; display: block; }
  #catalogView .plants canvas { background: color-mix(in srgb, var(--grass) 55%, transparent); padding: 2px; }
  #miniWrap { position: absolute; right: 10px; bottom: 10px; width: 118px; height: 118px; }
  #mini { position: absolute; inset: 0; padding: 0; border: 2px solid rgba(255, 255, 255, 0.55); border-radius: 50%; overflow: hidden; background: rgba(19, 34, 44, 0.55); box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25); cursor: pointer; opacity: 0.88; }
  #miniCanvas { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #north { position: absolute; left: 50%; top: -11px; transform: translateX(-50%); display: grid; justify-items: center; pointer-events: none; font-family: "Pixelify Sans", ui-monospace, monospace; }
  #north b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #c43a3a; color: #fff; border: 2px solid #2b1a12; font-size: 13px; line-height: 1; }
  .pill[hidden] { display: none; }
  #catalogView .cat-title { font-family: "Pixelify Sans", ui-monospace, monospace; font-size: 26px; margin: 28px 0 0; }
  #catalogView .animal { margin: 8px 0 14px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 60%, transparent); }
  #catalogView .aname { font-weight: 600; margin-bottom: 4px; }
  #catalogView .adesc { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  #catalogView .animal canvas { background: color-mix(in srgb, var(--grass) 45%, transparent); padding: 2px; }
  .pill { white-space: nowrap; }
  #scene.panning { cursor: grabbing; }
  #follow { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #tools { position: absolute; right: 8px; top: 50px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .pill { font-size: 18px; }
  #vitals { position: absolute; left: 8px; top: 8px; right: 8px; width: fit-content; max-width: calc(100% - 16px); padding: 6px 8px; border-radius: 12px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--edge); font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 4px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; overflow: hidden; }
  #vitals .vsep { width: 1px; height: 13px; background: rgba(0, 0, 0, 0.22); margin: 0 2px; }
  #vitals .vit { display: inline-flex; align-items: center; gap: 2px; }
  #vitals .vit i { font-style: normal; font-size: 11px; }
  #vitals .vit.low { animation: vlow 0.8s steps(2) infinite; }
  @keyframes vlow { 50% { opacity: 0.35; } }
  #pops { position: absolute; left: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; max-width: calc(100% - 150px); pointer-events: none; }
  .pop { align-self: flex-start; padding: 4px 9px; border-radius: 10px; font-size: 11.5px; line-height: 1.25; font-weight: 600; background: rgba(34, 28, 24, 0.86); color: #fff3d8; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); animation: popin 0.18s ease-out; }
  .pop.warn { background: rgba(128, 44, 28, 0.92); }
  .pop.good { background: rgba(36, 92, 48, 0.92); }
  .pop.out { opacity: 0; transition: opacity 0.4s; }
  @keyframes popin { from { transform: translateY(6px); opacity: 0; } }
  #fullMap { position: absolute; inset: 0; z-index: 30; background: #0e1a22; display: flex; flex-direction: column; padding: 8px; gap: 6px; }
  #fullMap[hidden] { display: none; }
  #fullMapCanvas { flex: 1; min-height: 0; width: 100%; image-rendering: pixelated; }
  #mapLegend { display: flex; flex-wrap: wrap; gap: 5px 10px; justify-content: center; color: #e8dcc8; font-size: 13px; padding: 2px 2px 6px; pointer-events: none; }
  #mapLegend span { display: inline-flex; align-items: center; gap: 4px; }
  #mapLegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.55); }
  #mapClose { position: absolute; right: 8px; top: 8px; z-index: 2; }
  #catalogClose { position: fixed; right: 10px; top: 10px; z-index: 5; color: var(--ink); text-shadow: none; background: color-mix(in srgb, var(--panel) 75%, transparent); border-color: var(--edge); }
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="scene" aria-label="Mapa com biomas"></canvas>
        <div id="vitals">
      <span id="biomeLabel"></span><span id="seasonRow"></span><span id="clockRow"></span><span id="ambRow"></span><span id="weatherIcon"></span><span id="actRow"></span><span class="vsep"></span>
      <span class="vit" data-k="food" title="Comida"><i>🍖</i><b>85</b></span><span class="vit" data-k="water" title="Água"><i>💧</i><b>85</b></span><span class="vit" data-k="temp" title="Temperatura do corpo"><i>🌡️</i><b>36.5</b></span><span class="vit" data-k="energy" title="Energia"><i>⚡</i><b>95</b></span><span class="vit" data-k="health" title="Saúde"><i>❤️</i><b>100</b></span>
    </div>
    <div id="tools"><button class="pill" id="follow" hidden aria-label="Voltar a seguir o Adão">🎯</button><button class="pill" id="zoomOut" aria-label="Diminuir o zoom">−</button><button class="pill" id="zoomIn" aria-label="Aumentar o zoom">+</button></div>
    <div id="pops" aria-live="polite"></div>
    <div id="fullMap" hidden><canvas id="fullMapCanvas"></canvas><div id="mapLegend"></div><button class="pill" id="mapClose" aria-label="Fechar o mapa">✕</button></div>
    <div id="miniWrap"><button id="mini" aria-label="Mini-mapa. Toque para abrir o mapa completo"><canvas id="miniCanvas"></canvas></button><div id="north" aria-label="Norte"><b>N</b></div></div>
        <div id="catalogView" hidden><button class="pill" id="catalogClose" aria-label="Fechar o catálogo">✕</button><div id="catalog"></div></div>
    <div id="loading" hidden>Gerando o mundo…</div>
  </main>
</div>
<script>
/*__SCRIPT__*/</script>
</body>
</html>
