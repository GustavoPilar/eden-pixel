/** Cabelo de Eva (castanho-avermelhado) e flor de enfeite. */
const EVA_HAIR = ['#4a2216', '#7a3a20', '#a85a30'];
const EVA_FLOWER = { petal: '#ffffff', petal2: '#ffd1dc', core: '#f5b83d' };

/** @param {number} l luz @returns {string} tom do cabelo de Eva */
function evaHairTone(l) { return EVA_HAIR[l > 0.8 ? 2 : l > 0.22 ? 1 : 0]; }

/** Gera os quadros de Eva: cabelo comprido até a cintura, sem barba, com flor no cabelo. */
class EvaSpriteFactory extends AdamSpriteFactory {
  /** Pinta um pixel de cabelo e o marca como parte da cabeça (para o contorno). */
  hair(g, isHead, x, y, l) {
    if (x < 0 || y < 0 || x >= SPRITE_W || y >= SPRITE_H) return;
    if (this.strand(x, y) && l > 0.1) l -= 0.3;
    else if ((x + y * 2) % 5 === 0 && l > 0.2) l += 0.3;
    g.set(x, y, evaHairTone(l));
    isHead[y * SPRITE_W + x] = 1;
  }

  /** Mecha mais escura em colunas alternadas, dá textura ao cabelo comprido. */
  strand(x) { return x % 3 === 0; }

  /** Pequena flor no cabelo (cruz de 5 pixels). */
  flower(g, x, y) {
    g.set(x, y, EVA_FLOWER.core);
    for (const [dx, dy, c] of [[-1, 0, EVA_FLOWER.petal], [1, 0, EVA_FLOWER.petal2], [0, -1, EVA_FLOWER.petal], [0, 1, EVA_FLOWER.petal2]]) g.set(x + dx, y + dy, c);
  }

  /** Cortina de cabelo atrás/ao lado, até a cintura, afinando nas pontas. */
  curtain(g, isHead, xMin, xMax, y0, y1) {
    for (let y = y0; y <= y1; y++) {
      const taper = y > y1 - 2 ? (y - (y1 - 2)) : 0;
      for (let x = xMin + taper; x <= xMax - taper; x++) {
        const edge = Math.min(x - xMin, xMax - x);
        this.hair(g, isHead, x, y, edge === 0 ? 0.05 : 0.4);
      }
    }
  }

  drawFront(g, isHead, N, eyeY, headCy, headRy, state) {
    const cx = CENTER_X;
    for (let y = 0; y < SPRITE_H; y++) for (let x = 0; x < SPRITE_W; x++) {
      if (!isHead[y * SPRITE_W + x]) continue;
      const n = N(x, y), e = Math.abs(n.dx);
      // franja repartida e laterais que descem
      if (n.dy < -0.4 + 0.5 * e * e + (n.dx > 0 ? 0.08 : 0) || (e > 0.8 && n.dy < 0.8)) this.hair(g, isHead, x, y, lightAt(n.dx, n.dy));
    }
    const endY = Math.round(headCy + headRy + 5);
    this.curtain(g, isHead, 4, 6, Math.round(headCy + 1), endY);
    this.curtain(g, isHead, 15, 17, Math.round(headCy + 1), endY);
    // rosto: olhos com cílios, bochechas, nariz e sorriso
    g.set(7, eyeY + 2, PAL.blush); g.set(14, eyeY + 2, PAL.blush);
    g.set(8, eyeY - 2, EVA_HAIR[1]); g.set(9, eyeY - 2, EVA_HAIR[1]); g.set(12, eyeY - 2, EVA_HAIR[1]); g.set(13, eyeY - 2, EVA_HAIR[1]);
    for (const x of [8, 13]) { if (!state.blink) g.set(x, eyeY, PAL.eye); g.set(x, eyeY + 1, PAL.eye); }
    g.set(7, eyeY - 1, EVA_HAIR[0]); g.set(14, eyeY - 1, EVA_HAIR[0]);
    g.set(10, eyeY + 2, PAL.skin[1]); g.set(11, eyeY + 2, PAL.skin[1]);
    g.set(9, eyeY + 3, PAL.mouth); g.set(10, eyeY + 4, PAL.mouth); g.set(11, eyeY + 4, PAL.mouth); g.set(12, eyeY + 3, PAL.mouth);
    this.flower(g, 15, eyeY - 4);
  }

  drawBack(g, isHead, N) {
    let headBottom = 0;
    for (let y = 0; y < SPRITE_H; y++) for (let x = 0; x < SPRITE_W; x++) if (isHead[y * SPRITE_W + x]) headBottom = Math.max(headBottom, y);
    for (let y = 0; y < SPRITE_H; y++) for (let x = 0; x < SPRITE_W; x++) {
      if (!isHead[y * SPRITE_W + x]) continue;
      const n = N(x, y);
      if (n.dy < 0.9) this.hair(g, isHead, x, y, lightAt(n.dx, n.dy));
    }
    // cortina de cabelo cobrindo as costas até a cintura
    this.curtain(g, isHead, 5, 16, headBottom - 2, headBottom + 6);
    this.curtain(g, isHead, 4, 17, headBottom - 5, headBottom - 3);
    this.flower(g, 15, headBottom - 7);
  }

  drawSide(g, isHead, N, eyeY, headCy, headRy, state) {
    const cx = CENTER_X;
    for (let y = 0; y < SPRITE_H; y++) for (let x = 0; x < SPRITE_W; x++) {
      if (!isHead[y * SPRITE_W + x]) continue;
      const n = N(x, y);
      const hair = n.dx < 0.12 ? n.dy < 0.9 : n.dy < -0.34 + 0.1 * n.dx;
      if (hair) this.hair(g, isHead, x, y, lightAt(n.dx, n.dy));
    }
    // cabelo comprido caindo pelas costas
    this.curtain(g, isHead, cx - 8, cx - 1, Math.round(headCy + 1), Math.round(headCy + headRy + 5));
    const ex = cx + 3;
    if (!state.blink) g.set(ex, eyeY, PAL.eye);
    g.set(ex, eyeY + 1, PAL.eye);
    g.set(ex + 1, eyeY - 1, EVA_HAIR[0]);
    g.set(ex, eyeY - 2, EVA_HAIR[1]); g.set(ex + 1, eyeY - 2, EVA_HAIR[1]);
    g.set(cx + 6, eyeY + 1, PAL.skin[2]); g.set(cx + 6, eyeY + 2, PAL.skin[1]);
    g.set(cx + 4, eyeY + 2, PAL.blush);
    g.set(cx + 4, eyeY + 4, PAL.mouth); g.set(cx + 5, eyeY + 4, PAL.mouth);
    this.flower(g, cx - 1, Math.round(headCy - headRy + 1));
  }
}

/**
 * Eva: companheira do Adão, com as mesmas necessidades dele. Sem casa, fica por perto dele
 * (passeia à vontade num raio curto e volta se se afastar muito); quando houver uma casa
 * (`setHome`), anda livre por ela. Quando precisa, sai sozinha para beber, comer ou dormir.
 */
class Eva {
  /** @param {World} world @param {{x: number, y: number}} adam */
  constructor(world, adam) {
    this.world = world;
    let sx = adam.x + 26, sy = adam.y + 6;
    for (let r = 0; r < 60 && !world.canStand(sx, sy); r += 4) { const a = r * 0.9; sx = adam.x + Math.cos(a) * (26 + r); sy = adam.y + Math.sin(a) * (14 + r); }
    this.walker = new HopWalker(sx, sy, world);
    this.surv = new Survivor('Eva', this.walker, world);
    this.surv.quiet = true;
    /** @type {{x: number, y: number}|null} */
    this.home = null;
    this.idleT = 2 + Math.random() * 2;
    this.callBack = 0;
    this.intent = null;
    this.cool = 0;
  }

  /** Define a casa: com ela, Eva deixa de acompanhar o Adão e anda livre ao redor. */
  setHome(x, y) { this.home = { x, y }; }

  /** @returns {string} o que ela está fazendo (para o rótulo) */
  doing() {
    const a = this.surv.action;
    if (a) return { sleep: 'desmaiada de sono', drink: 'bebendo água', gather: 'colhendo comida', faint: 'desmaiada' }[a.type];
    return this.walker.goal || this.walker.hop ? 'andando' : 'parada';
  }

  /** @returns {string} ícone do que ela está fazendo */
  doingIcon() {
    const a = this.surv.action;
    if (a) return { sleep: '😴', drink: '💧', gather: '🧺', faint: '😵' }[a.type];
    return this.walker.goal || this.walker.hop ? '🚶' : '🧍';
  }

  /** Planta comestível e segura mais próxima (ainda não colhida), ou null. */
  findFood(env) {
    const w = this.walker;
    let best = null, bd = 1e9;
    for (const p of this.world.plantsIn(w.x - 160, w.y - 160, w.x + 160, w.y + 160)) {
      if (!edibleNow(p, env.season) || isPoison(p) || env.isHarvested(p)) continue;
      const d = Math.hypot(p.x - w.x, p.y - w.y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  /** @param {number} dt @param {{x: number, y: number}} adam @param {object} env contexto das necessidades */
  update(dt, adam, env) {
    const w = this.walker, s = this.surv;
    w.update(dt);
    s.update(dt, { ...env, partner: adam });
    this.callBack -= dt;
    this.cool -= dt;
    const ctx = { world: this.world, isHarvested: env.isHarvested, notify: env.notify, season: env.season };
    // ações paradas: dormir até descansar (ou até o dia, se já deu para recuperar)
    if (s.action) return;
    // chegou ao destino de um pedido: beber ou colher
    if (this.intent && !w.goal && !w.hop) { const it = this.intent; this.intent = null; tryStartIntent(ctx, s, it, false); return; }
    if (!this.intent && this.cool <= 0) {
      const night = darkness(env.hour) > 0.85;
      if (hasBed(this.world, w.x, w.y) && (s.energy < 45 || (night && s.energy < 80))) { s.startAction('sleep', null, { bed: true }); return; }
      if (s.water < 22 || (s.water < 45 && s.energy > 30)) {
        const lake = findLake(this.world, w.x, w.y, 200);
        if (lake) { this.intent = { type: 'drink' }; w.goTo(lake.x, lake.y); return; }
        this.cool = 12;
      }
      if (s.food < 45) {
        const p = this.findFood(env);
        if (p) { this.intent = { type: 'gather', p }; w.goTo(p.x, p.y + (SOLID[p.id] ? 4 : 0)); return; }
        this.cool = 12;
      }
    }
    if (this.intent) return;
    const ref = this.home || adam;
    const dRef = Math.hypot(w.x - ref.x, w.y - ref.y);
    // sem casa: se ficar longe demais do Adão, vai até ele
    if (!this.home && dRef > 120 && this.callBack <= 0) {
      this.callBack = 2.5;
      const ang = Math.random() * Math.PI * 2;
      w.goTo(adam.x + Math.cos(ang) * 30, adam.y + Math.sin(ang) * 22);
      return;
    }
    if (w.goal || w.hop) return;
    this.idleT -= dt;
    if (this.idleT > 0) return;
    this.idleT = 2.5 + Math.random() * 6;
    const maxR = this.home ? 160 : 60;
    const ang = Math.random() * Math.PI * 2, r = 18 + Math.random() * (maxR - 18);
    w.goTo(ref.x + Math.cos(ang) * r, ref.y + Math.sin(ang) * r * 0.8);
  }
}
// ---------------------------------------------------------------------
// Necessidades do ser humano: fome, sede, temperatura do corpo, energia e saúde,
// ciclo de dia e noite, clima por região e formas de saciar cada necessidade.
// ---------------------------------------------------------------------

/** Duração de um dia (s de jogo = s reais) e hora em que o jogo começa. */
const DAY_SECONDS = 1200;
const START_HOUR = 8;

/** @param {number} clock relógio do jogo (s) @returns {number} hora do dia (0–24) */
function hourOf(clock) { return (START_HOUR + (clock / DAY_SECONDS) * 24) % 24; }

/**
 * Escuridão do céu por hora: 0 = dia, 1 = noite. O ciclo de 20 min tem 10 min de dia (6h–18h) e 10 min
 * de noite (18h–6h), com transições suaves de 4 h de jogo (≈3 min 20 s): tarde → noite e noite → amanhecer.
 * @param {number} hour hora (0–24) @returns {number}
 */
function darkness(hour) {
  const s = (x) => x * x * (3 - 2 * x);
  if (hour >= 20 || hour < 4) return 1;
  if (hour >= 16) return s((hour - 16) / 4);
  if (hour < 8) return 1 - s((hour - 4) / 4);
  return 0;
}

/** @param {number} h hora (0–24) @returns {string} "HH:MM" */
function fmtHour(h) { const m = Math.floor((h % 1) * 60); return `${String(Math.floor(h)).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }

/** Temperatura média do ar (°C) conforme a "latitude" (0 = polo Norte, 1 = Sul). */
const TEMP_ANCHORS = [[0, -28], [0.2, -14], [0.31, -4], [0.41, 3], [0.52, 15], [0.64, 24], [0.8, 28], [1, 31]];

/** Interpolação linear numa tabela [[x, y], ...]. */
function interp(table, x) {
  if (x <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) if (x <= table[i][0]) { const [x0, y0] = table[i - 1], [x1, y1] = table[i]; return y0 + ((y1 - y0) * (x - x0)) / (x1 - x0); }
  return table[table.length - 1][1];
}

/** Temperatura do ar (°C) num ponto do mundo, numa certa hora: clima da região + variação do dia. */
function ambientTemp(world, x, y, hour) {
  const b = world.biomeAt(x, y), t = world.tmp.t;
  let base = interp(TEMP_ANCHORS, t) + seasonOffset(t, b, world.sp), swing = 6;
  if (b === BIOME.DESERT) { base += 3; swing = 11; }
  else if (b === BIOME.JUNGLE || b === BIOME.SWAMP || b === BIOME.HUMID) { base += 1.5; swing = 3.5; }
  else if (b === BIOME.ICECAP) swing = 4;
  else if (BIOME_INFO[b].water || b === BIOME.BEACH) swing = 3.5;
  return base + swing * Math.sin(((hour - 9) / 24) * Math.PI * 2);
}

/** Árvores que fazem sombra. */
const SHADE_TREES = new Set(['oak', 'oakWet', 'birch', 'palm', 'jungleTree', 'cypress', 'spruce', 'spruceSnow']);

/** @returns {boolean} se há uma árvore de sombra bem perto do ponto */
function inShade(world, x, y) {
  const sz = LAYERS.L.size, cx = Math.floor(x / sz), cy = Math.floor(y / sz);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const p = world.plantAt('L', cx + dx, cy + dy);
    if (p && SHADE_TREES.has(p.id) && Math.hypot(p.x - x, (p.y - y) * 1.3) < 18) return true;
  }
  return false;
}

/** @returns {number} bioma de água (lago, gelo, mar) a até r px do ponto, ou -1 */
function waterBiomeNear(world, x, y, r) {
  let found = -1;
  for (let a = 0; a < 8; a++) for (const rr of [r * 0.5, r]) {
    const b = world.biomeAt(x + Math.cos(a * 0.785) * rr, y + Math.sin(a * 0.785) * rr);
    if (b === BIOME.LAKE) return b;
    if (BIOME_INFO[b].water && found < 0) found = b;
  }
  return found;
}

/** Procura água doce (lago) ao redor, em anéis; devolve um ponto dentro da água ou null. */
function findLake(world, x, y, maxR) {
  for (let r = 12; r <= maxR; r += 10) for (let a = 0; a < 16; a++) {
    const px = x + Math.cos(a * 0.3927) * r, py = y + Math.sin(a * 0.3927) * r;
    if (world.biomeAt(px, py) === BIOME.LAKE) return { x: px, y: py };
  }
  return null;
}

/**
 * O que dá para comer ou beber nas plantas: nome, comida e água que dão e quanto demora a renascer (s).
 * `v` = variantes que realmente têm fruto/cogumelo comestível.
 */
const EDIBLES = {
  bush: { name: 'Frutinhas', food: 11, water: 3, regrow: 300, v: [1] },
  bushWet: { name: 'Frutinhas silvestres', food: 11, water: 4, regrow: 300, v: [1] },
  mushroom: { name: 'Cogumelo marrom', food: 7, water: 0, regrow: 400, v: [1] },
  bigLeaf: { name: 'Bananas', food: 20, water: 2, regrow: 420 },
  palm: { name: 'Coco', food: 9, water: 32, regrow: 420 },
  barrel: { name: 'Cacto-barril (água)', food: 2, water: 26, regrow: 480 },
  saguaro: { name: 'Frutos de cacto', food: 10, water: 10, regrow: 420 },
  oak: { name: 'Bolotas', food: 6, water: 0, regrow: 360 },
  oakWet: { name: 'Bolotas', food: 6, water: 0, regrow: 360 },
  jungleTree: { name: 'Frutas da selva', food: 16, water: 6, regrow: 420 },
};

/** @returns {object|null} a ficha comestível da planta (ou null se não dá para comer) */
function edibleOf(p) { const e = EDIBLES[p.id]; return e && (!e.v || e.v.includes(p.v)) ? e : null; }

/** @returns {boolean} se é um cogumelo vermelho (venenoso) */
function isPoison(p) { return p.id === 'mushroom' && p.v !== 1; }

/** Chave única de uma planta (para marcar as já colhidas). */
function plantKey(p) { return `${p.id}:${p.x},${p.y}`; }

/** @returns {boolean} se há uma cama no ponto (por enquanto não existem camas: só se dorme desmaiando de sono) */
function hasBed(world, x, y) { return false; }

/** Uma pessoa (Adão ou Eva) com suas necessidades e a ação em andamento (beber, colher, dormir, desmaiar). */
class Survivor {
  /** @param {string} name @param {HopWalker} walker @param {World} world */
  constructor(name, walker, world) {
    this.name = name;
    this.walker = walker;
    this.world = world;
    this.food = 85;
    this.water = 85;
    this.energy = 95;
    this.temp = 36.5;
    this.health = 100;
    this.ambient = 20;
    this.action = null;
    this.lastHops = 0;
    this.quiet = false;
    this.warnAt = {};
    this.fxT = 0;
  }

  get sleeping() { return !!this.action && this.action.type === 'sleep'; }

  /** Começa uma ação parada (o personagem agacha e não anda até terminar). */
  startAction(type, dur, data = {}) {
    this.action = { type, t: 0, dur, data };
    this.walker.stop();
    this.walker.frozen = true;
    this.walker.forcePose = 'crouch';
  }

  /** Termina a ação atual. */
  endAction() {
    this.action = null;
    this.walker.frozen = false;
    this.walker.forcePose = null;
  }

  /** Aplica comida e água (limitadas a 100). */
  consume(food, water) {
    this.food = clamp(this.food + food, 0, 100);
    this.water = clamp(this.water + water, 0, 100);
  }

  /** Avisa uma vez a cada `gap` segundos (só o Adão fala, a menos que seja grave). */
  warn(env, key, text, gap = 30, urgent = false) {
    if (this.quiet && !urgent) return;
    if (env.clock - (this.warnAt[key] ?? -1e9) < gap) return;
    this.warnAt[key] = env.clock;
    env.notify(`${this.name}: ${text}`, 'warn');
  }

  /** @param {number} dt @param {{clock: number, hour: number, partner: HopWalker, notify: Function, harvest: Function, fx: Array}} env */
  update(dt, env) {
    const w = this.walker;
    // custo dos pulos
    const hops = w.hopCount - this.lastHops;
    this.lastHops = w.hopCount;
    this.energy -= hops * 0.35;
    // clima e temperatura do corpo
    const hour = env.hour, Ta = ambientTemp(this.world, w.x, w.y, hour);
    this.ambient = Ta;
    let eff = Ta;
    if (Ta > 24 && inShade(this.world, w.x, w.y)) eff -= 5;
    if (Ta > 26 && waterBiomeNear(this.world, w.x, w.y, 20) >= 0) eff -= 3;
    if (Ta < 20 && Math.hypot(env.partner.x - w.x, env.partner.y - w.y) < 28) eff += 3;
    if (w.goal || w.hop) eff += 2;
    if (this.sleeping) eff += 1.5;
    const wk = env.weather && env.weather.intensity > 0.05 ? env.weather : null;
    if (wk) eff -= WEATHER_COLD[wk.kind] * wk.intensity;
    const target = clamp(36.5 + 0.2 * (eff - 17), 24, 42);
    this.temp += ((target - this.temp) * dt) / 90;
    // fome, sede e energia
    const asleep = this.sleeping || (this.action && this.action.type === 'faint');
    const cold = this.temp < 35.3;
    this.food -= dt * (asleep ? 0.06 : 0.165) * (cold ? 1.5 : 1);
    this.water -= dt * (asleep ? 0.16 : 0.32) * (Ta > 30 ? 1 + Math.min(1.2, (Ta - 30) * 0.06) : 1) * (cold ? 0.85 : 1) * (wk && wk.kind === 'sand' ? 1 + 0.8 * wk.intensity : 1);
    if (this.sleeping) this.energy += dt * (this.action.data.bed ? 0.9 : 0.6);
    else if (!asleep) this.energy -= dt * ((w.goal || w.hop) ? 0.12 : 0.07);
    this.food = clamp(this.food, 0, 100);
    this.water = clamp(this.water, 0, 100);
    this.energy = clamp(this.energy, 0, 100);
    // andar mais devagar quando cansado; tremer de frio
    w.speedMul = (this.energy < 20 ? 0.65 : 1) * (wk ? 1 - (1 - WEATHER_SLOW[wk.kind]) * wk.intensity : 1);
    w.shiver = this.temp < 35.3 && !asleep;
    // ação em andamento
    const a = this.action;
    this.fxT -= dt;
    if (a) {
      a.t += dt;
      if (a.type === 'drink') {
        this.water = clamp(this.water + dt * (a.data.ice ? 5 : 14), 0, 100);
        if (a.data.ice) this.temp -= dt * 0.02;
        if (this.fxT <= 0) { this.fxT = 0.22; env.fx.push({ type: 'drop', x: w.x + 5, y: w.y - 3, t: 0 }); }
        if (a.t >= a.dur) this.endAction();
      } else if (a.type === 'gather') {
        if (a.t >= a.dur) {
          const p = a.data.p, e = edibleOf(p);
          if (e) { this.consume(e.food, e.water); env.harvest(p, e); for (let i = 0; i < 5; i++) env.fx.push({ type: 'spark', x: w.x + (i - 2) * 2, y: w.y - 16, t: -i * 0.06 }); if (!this.quiet) env.notify(`${this.name}: ${e.name} (+${e.food} comida${e.water ? `, +${e.water} água` : ''})`, 'good'); }
          this.endAction();
        }
      } else if (a.type === 'sleep') {
        if (this.fxT <= 0) { this.fxT = 1.1; env.fx.push({ type: 'zzz', x: w.x + 4, y: w.y - 24, t: 0 }); }
        const wake = a.data.bed ? 100 : 40;
        if (this.energy >= wake) { this.endAction(); if (!this.quiet) env.notify(a.data.bed ? `${this.name} acordou descansado` : `${this.name} acordou, ainda cansado`, a.data.bed ? 'good' : 'info'); }
      } else if (a.type === 'faint') {
        if (a.t >= a.dur) {
          this.endAction();
          this.health = 30; this.food = Math.max(this.food, 30); this.water = Math.max(this.water, 30); this.energy = Math.max(this.energy, 40);
          this.temp = clamp(this.temp, 35.4, 38);
          env.notify(`${this.name} acordou fraco, mas vivo`);
        }
      }
    } else if (this.energy <= 0) {
      this.startAction('sleep', null, { forced: true });
      this.warn(env, 'exausto', 'desmaiou de sono!', 20, true);
    }
    // dano e recuperação
    let dmg = 0;
    if (this.water <= 0) dmg += 0.6;
    if (this.food <= 0) dmg += 0.25;
    if (this.temp < 34.5) dmg += Math.min(2, (34.5 - this.temp) * 0.25);
    if (this.temp > 39.5) dmg += Math.min(2, (this.temp - 39.5) * 0.4);
    if (dmg > 0) this.health -= dmg * dt;
    else if (this.food > 40 && this.water > 40 && this.temp > 35.5 && this.temp < 38) this.health += 0.3 * dt;
    this.health = clamp(this.health, 0, 100);
    if (this.health <= 0 && !(this.action && this.action.type === 'faint')) {
      this.startAction('faint', 8);
      this.warn(env, 'desmaio', 'desmaiou!', 10, true);
    }
    // avisos
    if (this.water < 25) this.warn(env, 'sede', 'está com sede!');
    if (this.food < 25) this.warn(env, 'fome', 'está com fome!');
    if (this.temp < 35) this.warn(env, 'frio', 'está com frio!');
    if (this.temp > 38.3) this.warn(env, 'calor', 'está com calor demais!');
    if (this.energy < 20 && !asleep) this.warn(env, 'cansaco', 'muito cansado: vai desmaiar de sono');
    if (this.health < 30) this.warn(env, 'saude', 'está com a saúde baixa!', 25, true);
  }

  /** @returns {string} descrição curta da temperatura do corpo */
  tempLabel() {
    const t = this.temp;
    return t < 32 ? 'congelando' : t < 34.5 ? 'hipotermia' : t < 35.5 ? 'com frio' : t <= 37.6 ? 'normal' : t <= 38.5 ? 'quente' : t < 39.5 ? 'febre' : 'hipertermia';
  }
}

/** Ícone de cada ambiente (o nome não aparece mais no painel). */
const BIOME_ICON = ['🌊', '🌊', '🏖️', '🏞️', '🧊', '🏜️', '❄️', '🏔️', '🌿', '🌲', '🌳', '🌴', '🪷', '🧊'];

/** @returns {boolean} se há um bioma específico no ponto ou a até r px dele */
function biomeNear(world, x, y, r, id) {
  if (world.biomeAt(x, y) === id) return true;
  for (let a = 0; a < 8; a++) if (world.biomeAt(x + Math.cos(a * 0.785) * r, y + Math.sin(a * 0.785) * r) === id) return true;
  return false;
}

/**
 * Tenta começar a ação pedida (beber ou colher) quando a pessoa chegou ao destino.
 * @param {{world: World, isHarvested: Function, notify: Function}} ctx @param {Survivor} surv @param {{type: string, p?: object}} it @param {boolean} say se avisa quando falha
 * @returns {boolean}
 */
function tryStartIntent(ctx, surv, it, say) {
  const w = surv.walker, world = ctx.world;
  if (it.type === 'drink') {
    if (waterBiomeNear(world, w.x, w.y, 14) === BIOME.LAKE) { surv.startAction('drink', 3.4, { ice: false }); return true; }
    if (biomeNear(world, w.x, w.y, 10, BIOME.ICE)) { surv.startAction('drink', 3.4, { ice: true }); if (say) ctx.notify('Comendo gelo: mata a sede, mas esfria o corpo.'); return true; }
    if (say) ctx.notify('Não consegui chegar até a água.');
    return false;
  }
  if (it.type === 'gather') {
    const p = it.p;
    if (!edibleNow(p, ctx.season)) { if (say) ctx.notify('Ainda não é a época desta comida.'); return false; }
    if (ctx.isHarvested(p)) { if (say) ctx.notify('Já foi colhido. Vai demorar para crescer de novo.'); return false; }
    if (Math.hypot(p.x - w.x, (p.y - w.y) * 1.2) > 26) { if (say) ctx.notify('Não consegui chegar perto.'); return false; }
    surv.startAction('gather', 1.4, { p });
    return true;
  }
  return false;
}

// ---------------------------------------------------------------------
// Estações do ano: clima, cores do chão e das plantas, gelo nos lagos,
// comida de época e tempo (chuva e neve), cada ambiente do seu jeito.
// ---------------------------------------------------------------------

/** Cada estação dura 2 ciclos de dia e noite (40 min); o ano tem 4 estações. */
const SEASON_SECONDS = 2400;
/** Quantos passos visuais cada estação tem (o chão é refeito a cada passo). */
const SEASON_STEPS = 8;
/** Posição inicial no ano (0 = começo da primavera). */
const START_SP = 0.35;
const SEASONS = [
  { name: 'Primavera', icon: '🌸' },
  { name: 'Verão', icon: '☀️' },
  { name: 'Outono', icon: '🍂' },
  { name: 'Inverno', icon: '❄️' },
];

/** @param {number} clock relógio do jogo (s) @returns {number} posição no ano, de 0 a 4 */
function seasonPos(clock) { return ((START_SP + clock / SEASON_SECONDS) % 4 + 4) % 4; }

/** Pulso suave (0–1) centrado em `c` com meia-largura `hw`, circular no ano de 4 estações. */
function bump(sp, c, hw) {
  let d = Math.abs(sp - c);
  d = Math.min(d, 4 - d);
  return d >= hw ? 0 : 0.5 * (1 + Math.cos((Math.PI * d) / hw));
}

/** Quanto as estações são marcadas conforme a latitude: pouco nos trópicos, muito nas regiões temperadas e frias. */
const WARM_AMP = [[0, 1.6], [0.15, 2.2], [0.3, 2.0], [0.41, 1.5], [0.52, 1.0], [0.64, 0.6], [0.8, 0.3], [1, 0.3]];
const COLD_AMP = [[0, 0.8], [0.15, 0.9], [0.3, 1.0], [0.41, 1.15], [0.52, 1.0], [0.64, 0.4], [0.8, 0.15], [1, 0.15]];
/** Variação de temperatura (°C) no meio de cada estação: primavera, verão, outono, inverno. */
const SEASON_KEYS = [-0.5, 7, 1.5, -12];

/** @returns {number} variação sazonal da temperatura (°C) numa latitude, com transição suave entre as estações */
function seasonOffset(t, biome, sp) {
  // os valores-chave valem no meio de cada estação (sp = 0,5; 1,5; 2,5; 3,5)
  const s2 = (sp + 3.5) % 4, i = Math.floor(s2), f = s2 - i;
  const k0 = SEASON_KEYS[i], k1 = SEASON_KEYS[(i + 1) % 4], u = (1 - Math.cos(Math.PI * f)) / 2;
  let v = k0 + (k1 - k0) * u;
  v *= v > 0 ? interp(WARM_AMP, t) : interp(COLD_AMP, t);
  if (biome === BIOME.DESERT) v *= v > 0 ? 1.4 : 0.7;
  return v;
}

/** Temperatura média (°C, sem a variação do dia) de um ambiente numa época do ano. */
function meanTemp(b, t, sp) {
  let base = interp(TEMP_ANCHORS, t);
  if (b === BIOME.DESERT) base += 3;
  else if (b === BIOME.JUNGLE || b === BIOME.SWAMP || b === BIOME.HUMID) base += 1.5;
  return base + seasonOffset(t, b, sp);
}

/** Quanto as árvores de folha caduca estão sem folhas (0–1): caem no fim do outono e voltam na primavera. */
function bareAmount(sp) {
  const x = sp < 0.8 ? sp + 4 : sp;
  if (x < 2.4) return 0;
  if (x < 3.2) return (x - 2.4) / 0.8;
  if (x < 4.3) return 1;
  if (x < 4.8) return 1 - (x - 4.3) / 0.5;
  return 0;
}

/**
 * Aparência sazonal de um ponto (preenche `o`): neve no chão, cor de outono, flores, seca,
 * tom apagado do inverno e queda das folhas. Cada ambiente reage de um jeito.
 */
function seasonLookInto(o, b, t, sp) {
  const water = b === BIOME.DEEP || b === BIOME.SHALLOW || b === BIOME.LAKE;
  const Tm = meanTemp(b, t, sp);
  let snow = water ? 0 : clamp((7 - Tm) / 6, 0, 1);
  if (b === BIOME.ICECAP) snow = Math.max(snow, 0.9);
  // 1 nas regiões temperadas e boreais, 0 nos trópicos e polos
  const temperate = clamp(Math.min((t - 0.18) / 0.14, (0.8 - t) / 0.2), 0, 1);
  o.snow = snow;
  o.autumn = bump(sp, 2.45, 0.85) * temperate;
  o.bare = bareAmount(sp) * temperate;
  o.bloom = clamp((b === BIOME.DESERT ? bump(sp, 0.6, 1.1) * 0.9 : bump(sp, 0.7, 1.3) * temperate) + (b === BIOME.JUNGLE ? bump(sp, 1, 1.2) * 0.5 : 0), 0, 1);
  let dry = bump(sp, 1.3, 1) * (b === BIOME.MEADOW ? 0.45 : b === BIOME.DESERT ? 0.25 : temperate * 0.12);
  if (b === BIOME.JUNGLE || b === BIOME.HUMID) dry = Math.max(dry, bump(sp, 3.5, 0.9) * 0.35);
  o.dry = dry;
  o.dull = bump(sp, 3.5, 1) * temperate * (1 - snow);
  return o;
}

/** @returns {object} aparência sazonal (objeto novo) */
function seasonLookAt(b, t, sp) { return seasonLookInto({}, b, t, sp); }

// ---------- cores ----------
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d > 0) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}

function hsl2rgb(h, s, l) {
  h = (((h % 360) + 360) % 360) / 360;
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = (t) => { if (t < 0) t += 1; if (t > 1) t -= 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [Math.round(f(h + 1 / 3) * 255), Math.round(f(h) * 255), Math.round(f(h - 1 / 3) * 255)];
}

const SNOW_COLS = [[244, 248, 253], [228, 238, 248], [214, 226, 242], [255, 255, 255]];
/** Chão que aparece quando a neve derrete nos ambientes frios. */
const THAW = {
  [BIOME.SNOW]: [[62, 90, 52], [79, 110, 63], [94, 122, 71], [107, 90, 66]],
  [BIOME.TUNDRA]: [[122, 138, 74], [140, 154, 88], [106, 120, 64], [154, 138, 90]],
  [BIOME.ICECAP]: [[158, 196, 224], [180, 212, 236], [214, 230, 244], [244, 248, 253]],
};
const FLOWER_COLS = [[255, 190, 210], [255, 255, 255], [255, 224, 110], [200, 150, 230]];
const DESERT_FLOWER_COLS = [[250, 160, 60], [250, 220, 90], [230, 110, 150]];

/**
 * Aplica a estação a um pixel de chão: cor de outono, seca, flores e neve (em manchas).
 * Nos ambientes frios a neve já é o chão: o degelo é que aparece no verão.
 */
function seasonalGround(col, b, x, y, L) {
  if (b === BIOME.DEEP || b === BIOME.SHALLOW) return col;
  if (b === BIOME.SNOW || b === BIOME.TUNDRA || b === BIOME.ICECAP) {
    if (L.snow >= 0.995) return col;
    const n = valueNoise(x / 7, y / 7, 83) * 0.6 + hash2(x, y) * 0.4;
    if (n < L.snow * 1.05 - 0.02) return col;
    const pal = THAW[b];
    return pal[Math.floor(hash2(x + 5, y + 9) * pal.length)];
  }
  if (b === BIOME.LAKE || b === BIOME.ICE) return col;
  let out = col;
  if (L.autumn > 0.01 || L.dry > 0.01 || L.dull > 0.01) {
    const [hh, s, l] = rgb2hsl(col[0], col[1], col[2]);
    if (hh > 55 && hh < 175 && s > 0.1) {
      const tgt = b === BIOME.FOREST || b === BIOME.HUMID ? 24 : b === BIOME.MEADOW ? 40 : 34;
      let nh = hh + (tgt + (hash2(x, y) - 0.5) * 20 - hh) * L.autumn * 0.85, ns = s * (1 - 0.1 * L.autumn), nl = l * (1 - 0.02 * L.autumn);
      if (L.dry > 0) { nh += (50 - nh) * L.dry * 0.75; ns *= 1 - 0.25 * L.dry; nl *= 1 + 0.05 * L.dry; }
      if (L.dull > 0) { nh += (60 - nh) * L.dull * 0.3; ns *= 1 - 0.35 * L.dull; nl *= 1 - 0.04 * L.dull; }
      out = hsl2rgb(nh, ns, nl);
    }
  }
  if (L.bloom > 0.05 && hash2(x * 3 + 1, y * 7 + 2) < L.bloom * 0.012 && (b === BIOME.MEADOW || b === BIOME.FOREST || b === BIOME.HUMID || b === BIOME.DESERT || b === BIOME.JUNGLE)) {
    const pal = b === BIOME.DESERT ? DESERT_FLOWER_COLS : FLOWER_COLS;
    out = pal[Math.floor(hash2(x + 11, y + 4) * pal.length)];
  }
  if (L.snow > 0.01) {
    const n = valueNoise(x / 6, y / 6, 77) * 0.55 + hash2(x + 13, y + 2) * 0.45, th = L.snow * 1.12 - 0.04;
    if (n < th) out = SNOW_COLS[Math.floor(hash2(x + 7, y + 3) * 4)];
    else if (n < th + 0.08) out = [Math.round((out[0] + 250) / 2), Math.round((out[1] + 252) / 2), Math.round((out[2] + 255) / 2)];
  }
  return out;
}

// ---------- plantas ----------
const DECIDUOUS = new Set(['oak', 'oakWet', 'birch']);
const SHRUBS = new Set(['bush', 'bushWet', 'fern']);
const GRASS = new Set(['tuft', 'flowers', 'tuftBeach', 'tuftDry']);
const AUTUMN_HUE = { oak: 24, oakWet: 30, birch: 48, bush: 10, bushWet: 18, fern: 34, tuft: 44, flowers: 44, tuftBeach: 50 };
/** Quando a neve derrete, as plantas "nevadas" viram as versões normais. */
const THAW_SWAP = { spruceSnow: 'spruce', tuftSnow: 'tuft', rockSnow: 'rock', snowBush: 'bush' };

/** @returns {number} valor arredondado em `n` níveis (para guardar sprites em cache) */
function quant(v, n) { return Math.round(clamp(v, 0, 1) * n) / n; }

/** @returns {object} aparência sazonal de uma planta, em níveis discretos */
function makeLook(b, t, sp) {
  const L = seasonLookAt(b, t, sp);
  const look = { snow: quant(L.snow, 4), autumn: quant(L.autumn, 4), bare: quant(L.bare, 4), bloom: quant(L.bloom, 3), dry: quant(L.dry, 3), dull: quant(L.dull, 2) };
  look.thaw = L.snow < 0.35;
  look.key = `${look.snow}|${look.autumn}|${look.bare}|${look.bloom}|${look.dry}|${look.dull}`;
  return look;
}

/** Recolore um sprite para a estação: folhas de outono, queda das folhas, flores, seca e neve nas partes de cima. */
function seasonize(src, id, look) {
  const w = src.width, h = src.height, cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.drawImage(src, 0, 0);
  const img = cx.getImageData(0, 0, w, h), d = img.data;
  const deciduous = DECIDUOUS.has(id), shrub = SHRUBS.has(id), grass = GRASS.has(id), hue0 = AUTUMN_HUE[id];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (!d[i + 3] || !(deciduous || shrub || grass)) continue;
    const [hh, s, l] = rgb2hsl(d[i], d[i + 1], d[i + 2]);
    if (!(hh > 55 && hh < 175 && s > 0.12 && l > 0.13)) continue;
    const hs = hash2(x * 5 + id.length, y * 3 + 7);
    if ((deciduous || shrub) && look.bare > 0 && hs < look.bare * (deciduous ? 0.82 : 0.55)) { d[i + 3] = 0; continue; }
    let nh = hh, ns = s, nl = l;
    if (hue0 !== undefined && look.autumn > 0) { nh = hh + (hue0 + (hash2(x, y) - 0.5) * 22 - hh) * look.autumn; ns = Math.min(1, s * (1 + 0.1 * look.autumn)); nl = l * (1 - 0.04 * look.autumn); }
    if (look.dry > 0) { nh += (52 - nh) * look.dry * (grass ? 0.8 : 0.4); ns *= 1 - 0.25 * look.dry; }
    if (look.dull > 0 && grass) { nh += (48 - nh) * look.dull * 0.5; ns *= 1 - 0.4 * look.dull; }
    if (look.bloom > 0 && (deciduous || shrub) && hs < look.bloom * 0.1) {
      const bc = [[255, 220, 232], [255, 255, 255], [255, 190, 214]][Math.floor(hash2(x + 3, y + 1) * 3)];
      d[i] = bc[0]; d[i + 1] = bc[1]; d[i + 2] = bc[2];
      continue;
    }
    if (look.bloom > 0) nl = Math.min(0.9, nl * (1 + 0.06 * look.bloom));
    const [nr, ng, nb] = hsl2rgb(nh, ns, nl);
    d[i] = nr; d[i + 1] = ng; d[i + 2] = nb;
  }
  if (look.snow > 0) {
    const a = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : d[(y * w + x) * 4 + 3]);
    const mark = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!a(x, y)) continue;
      const hs = hash2(x * 11 + 3, y * 13 + 5), top = !a(x, y - 1), top2 = !a(x, y - 2);
      if (top && hs < 0.25 + 0.75 * look.snow) mark.push([x, y, 0]);
      else if (top2 && hs < look.snow * 0.55) mark.push([x, y, 1]);
      else if (grass && hs < look.snow * 0.7) mark.push([x, y, 2]);
    }
    for (const [x, y, k] of mark) {
      const i = (y * w + x) * 4, c = SNOW_COLS[k === 1 ? 1 : Math.floor(hash2(x + 9, y + 1) * 4)];
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
    }
  }
  cx.putImageData(img, 0, 0);
  return cv;
}

/** Guarda os sprites já recoloridos para cada aparência. */
class SeasonSprites {
  constructor() {
    /** @type {Map<string, HTMLCanvasElement>} */
    this.cache = new Map();
    /** Último sprite de cada planta (mostrado enquanto o novo não fica pronto) e limite de novos por quadro. */
    this.last = new Map();
    this.budget = 12;
  }

  /** @returns {HTMLCanvasElement} sprite da planta na aparência sazonal dada */
  get(id, v, look, species) {
    const id2 = look.thaw && THAW_SWAP[id] ? THAW_SWAP[id] : id;
    const base = species.get(id2, v);
    if (!look.snow && !look.autumn && !look.bare && !look.bloom && !look.dry && !look.dull) return base;
    const key = `${id2}:${v}:${look.key}`;
    let c = this.cache.get(key);
    const lk = `${id2}:${v}`;
    if (!c) {
      const prev = this.last.get(lk);
      if (this.budget <= 0 && prev) return prev;
      this.budget--;
      c = seasonize(base, id2, look);
      this.cache.set(key, c);
    }
    this.last.set(lk, c);
    return c;
  }
}

// ---------- comida de época ----------
/** Em quais estações (0 primavera, 1 verão, 2 outono, 3 inverno) cada planta dá comida; as ausentes dão o ano todo. */
const EDIBLE_SEASONS = { bush: [1, 2], bushWet: [1, 2], mushroom: [0, 2], saguaro: [1], oak: [2], oakWet: [2], jungleTree: [0, 1] };

/** @returns {object|null} a ficha comestível da planta, só se estiver na época */
function edibleNow(p, seasonIdx) {
  const e = edibleOf(p);
  if (!e) return null;
  const s = EDIBLE_SEASONS[p.id];
  return s && !s.includes(seasonIdx) ? null : e;
}

// ---------- tempo: chuva, neve, nevasca e chuva de areia ----------
/** Frio extra (°C) que cada tempo causa no corpo, por intensidade. */
const WEATHER_COLD = { rain: 3, snow: 2, blizzard: 7, sand: 2 };
/** Quanto cada tempo atrapalha o andar (multiplicador de velocidade). */
const WEATHER_SLOW = { rain: 1, snow: 0.95, blizzard: 0.8, sand: 0.85 };
const WEATHER_ICON = { rain: '🌧️', snow: '🌨️', blizzard: '🌬️', sand: '🌪️' };
const WEATHER_NAME = { rain: 'chuva', snow: 'neve', blizzard: 'nevasca', sand: 'chuva de areia' };

/**
 * Tempo que aparece e some sozinho conforme a estação e o ambiente:
 * chuva (úmido), neve e nevasca (frio; a nevasca é bem forte nas terras geladas),
 * chuva de areia (só no deserto, mais no verão e na primavera).
 */
class Weather {
  constructor() {
    this.kind = 'rain';
    this.intensity = 0;
    this.target = 0;
    this.timer = 25 + Math.random() * 40;
    this.announced = false;
  }

  /** @param {number} dt @param {{sp: number, biome: number, ambient: number}} c */
  update(dt, c) {
    this.timer -= dt;
    const cold = c.ambient < 1.5, snowy = this.kind === 'snow' || this.kind === 'blizzard';
    // tempo que não combina com o lugar vai se acalmando
    const wrong = (this.kind === 'sand' && c.biome !== BIOME.DESERT) || (snowy && c.ambient > 3) || (this.kind === 'rain' && c.ambient < -1);
    if (wrong && this.target > 0) { this.target = 0; this.timer = Math.min(this.timer, 15 + Math.random() * 15); }
    if (this.timer <= 0) {
      const si = Math.floor(c.sp) % 4;
      const polar = c.biome === BIOME.SNOW || c.biome === BIOME.TUNDRA || c.biome === BIOME.ICECAP;
      if (c.biome === BIOME.DESERT && Math.random() < [0.3, 0.38, 0.25, 0.12][si]) {
        this.kind = 'sand'; this.target = 0.5 + Math.random() * 0.5; this.timer = 55 + Math.random() * 60; this.announced = false;
      } else if (cold && Math.random() < [0.3, 0.12, 0.38, 0.5][si]) {
        const storm = (polar || c.ambient < -5) && Math.random() < 0.5;
        this.kind = storm ? 'blizzard' : 'snow';
        this.target = storm ? 0.65 + Math.random() * 0.35 : 0.4 + Math.random() * 0.5;
        this.timer = 60 + Math.random() * 90; this.announced = false;
      } else if (!cold && c.biome !== BIOME.DESERT) {
        let mul = 1;
        if (c.biome === BIOME.JUNGLE) mul = [1.3, 1.7, 0.8, 0.3][si] * 1.3;
        else if (c.biome === BIOME.HUMID || c.biome === BIOME.SWAMP) mul = 1.25;
        else if (c.biome === BIOME.MEADOW) mul = 0.8;
        if (Math.random() < [0.35, 0.18, 0.35, 0.32][si] * mul) { this.kind = 'rain'; this.target = 0.4 + Math.random() * 0.6; this.timer = 60 + Math.random() * 90; this.announced = false; }
        else { this.target = 0; this.timer = 50 + Math.random() * 100; }
      } else { this.target = 0; this.timer = 40 + Math.random() * 80; }
    }
    this.intensity += clamp(this.target - this.intensity, -dt * 0.12, dt * 0.12);
  }
}

/** Variações de um sprite "entortadas" pelo vento (a base fica parada e o topo se move), guardadas em cache. */
class SwayBank {
  constructor() { /** @type {WeakMap<HTMLCanvasElement, Map<number, HTMLCanvasElement>>} */ this.map = new WeakMap(); }

  /** @returns {HTMLCanvasElement} o sprite deslocado `level` px no topo (−3 a 3) */
  get(src, level, pow) {
    let m = this.map.get(src);
    if (!m) { m = new Map(); this.map.set(src, m); }
    let c = m.get(level);
    if (!c) {
      const w = src.width, h = src.height;
      c = document.createElement('canvas');
      c.width = w + 6; c.height = h;
      const cx = c.getContext('2d');
      for (let y = 0; y < h; y++) cx.drawImage(src, 0, y, w, 1, 3 + Math.round(level * Math.pow((h - 1 - y) / Math.max(1, h - 1), pow)), y, w, 1);
      m.set(level, c);
    }
    return c;
  }
}

/** Grade com escala: o código desenha em coordenadas "grandes" e o resultado sai menor, em pixels inteiros. */
class ScaledGrid {
  /** @param {number} w @param {number} h @param {number} s fator de escala (0–1) */
  constructor(w, h, s) {
    this.s = s;
    this.grid = new PixelGrid(Math.max(4, Math.ceil(w * s)), Math.max(4, Math.ceil(h * s)));
    this.w = this.grid.w;
    this.h = this.grid.h;
  }

  set(x, y, c) { this.grid.set(Math.round(x * this.s), Math.round(y * this.s), c); }

  get(x, y) { return this.grid.get(Math.round(x * this.s), Math.round(y * this.s)); }

  /** Escrita direta (já em pixels finais). */
  put(x, y, c) { this.grid.set(x, y, c); }

  pget(x, y) { return this.grid.get(x, y); }

  toCanvas() { return this.grid.toCanvas(); }

  mirrored() { return this.grid.mirrored(); }
}

/** Escala usada pelos construtores durante a montagem de um quadro. */
let CUR_SCALE = 1;

/** @returns {ScaledGrid} grade na escala da espécie em construção */
function newGrid(w, h) { return new ScaledGrid(w, h, CUR_SCALE); }

/** Pinta só onde já existe pixel (barriga, manchas, brilhos). */
function blobOn(g, cx, cy, rx, ry, ramp, bias = 0) {
  const k = g.s || 1;
  if (k !== 1) { cx *= k; cy *= k; rx = Math.max(0.9, rx * k); ry = Math.max(0.9, ry * k); }
  const get = g.pget ? g.pget.bind(g) : g.get.bind(g), put = g.put ? g.put.bind(g) : g.set.bind(g);
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++) for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
    const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
    if (dx * dx + dy * dy > 1 || get(x, y) === null) continue;
    put(x, y, ramp[toneIdx(lightAt(dx, dy) + bias, x, y, 0.1)]);
  }
}

/** Pontos soltos só sobre pixels existentes (manchas, pintas). */
function speckle(g, seed, n, color, x0, y0, x1, y1) {
  const rnd = mulberry32(seed), k = g.s || 1;
  const get = g.pget ? g.pget.bind(g) : g.get.bind(g), put = g.put ? g.put.bind(g) : g.set.bind(g);
  const cnt = Math.max(2, Math.round(n * k * k));
  for (let i = 0; i < cnt; i++) { const x = Math.floor((x0 + rnd() * (x1 - x0)) * k), y = Math.floor((y0 + rnd() * (y1 - y0)) * k); if (get(x, y) !== null) put(x, y, color); }
}

/** Opções de pose de um quadro de quadrúpede. */
function quadPose(p, frame) {
  const sit = !!p.sitter;
  switch (frame) {
    case 'w0': return { walk: 1 };
    case 'w1': return { walk: 2, bob: -1 };
    case 'eat0': return sit ? { sit: true, paws: true } : { head: 'down' };
    case 'eat1': return sit ? { sit: true, paws: true, mouth: true } : { head: 'down', mouth: true };
    case 'act0': case 'act1': {
      const b = frame === 'act1';
      switch (p.act) {
        case 'howl': return { head: 'up', mouth: b };
        case 'yawn': return { mouth: b, eyesClosed: true, head: b ? 'up' : 'level' };
        case 'lie': return { lie: true, head: b ? 'down' : 'level', eyesClosed: b };
        case 'sit': return { sit: true, tall: b };
        case 'alert': return { sit: true, tall: true, earsUp: b };
        default: return {};
      }
    }
    default: return {};
  }
}

/** Corpo de quadrúpede: pernas, corpo, pescoço, cabeça, orelhas, chifres e cauda. */
function drawQuad(p, frame) {
  const g = newGrid(p.W, p.H);
  const ps = quadPose(p, frame);
  const R = p.fur, HR = p.headRamp || p.fur, gy = p.H - 3;
  const brx = p.brx, bry = p.bry;
  let bx = p.bx, by = gy - p.legLen - bry * 0.55 + (ps.bob || 0);
  if (ps.lie) by = gy - bry * 0.85;
  if (ps.sit) { by = gy - bry * (ps.tall ? 1.15 : 0.95); }
  const hipY = by + bry * 0.55;
  const legR = p.legs || R;
  const sw = p.swing || 3;
  // pernas
  const legsDef = [
    { x: bx - brx * 0.55, far: true, ph: ps.walk === 1 ? -1 : 1 },
    { x: bx + brx * 0.58, far: true, ph: ps.walk === 1 ? -1 : 1 },
    { x: bx - brx * 0.4, far: false, ph: ps.walk === 1 ? -1 : 1 },
    { x: bx + brx * 0.7, far: false, ph: ps.walk === 1 ? 1 : -1 },
  ];
  // pernas do mesmo lado alternam: ajuste para marcha diagonal
  legsDef[0].ph = ps.walk === 1 ? 1 : -1; legsDef[1].ph = ps.walk === 1 ? -1 : 1;
  if (!ps.lie && !ps.sit) {
    for (const l of legsDef) {
      const off = ps.walk ? l.ph * sw : 0;
      thickLine(g, l.x, hipY, l.x + off, gy, p.legW, (t, dx) => legR[l.far ? (dx < 0 ? 1 : 0) : (dx < 0 ? 2 : 1)]);
      g.set(Math.round(l.x + off), gy, legR[0]);
    }
  } else if (ps.lie) {
    fillBlob(g, bx + brx * 0.6, gy - 1.3, p.legW + 1.2, 1.5, legR, 0.1);
    fillBlob(g, bx - brx * 0.5, gy - 1.5, p.legW + 2, 1.8, legR, 0.1);
  } else {
    fillBlob(g, bx - brx * 0.35, gy - bry * 0.6, brx * 0.5, bry * 0.7, R, 0.12);
    thickLine(g, bx + brx * 0.55, by + bry * 0.4, bx + brx * 0.8, gy, p.legW, () => legR[1]);
  }
  // corpo
  if (p.wool) {
    for (const [dx, dy, r] of [[-0.55, 0.05, 4.2], [0, -0.35, 4.6], [0.5, 0.0, 4.2], [-0.2, 0.35, 4], [0.3, 0.4, 3.8], [-0.7, 0.4, 3.4], [0.75, 0.35, 3.2]]) fillBlob(g, bx + dx * brx, by + dy * bry, r, r * 0.9, R, 0.2);
  } else {
    fillBlob(g, bx, by, brx, bry, R, 0.14);
    if (p.belly) blobOn(g, bx + brx * 0.1, by + bry * 0.62, brx * 0.85, bry * 0.42, p.belly, 0.1);
  }
  if (p.hump) fillBlob(g, bx - brx * 0.1, by - bry - 1.5, 4.2, 3.8, R, 0.14);
  // cabeça e pescoço
  const hr = p.headR * (p.cute === false ? 1 : 1.2);
  let hx, hy, ang;
  if (ps.sit) { hx = bx + brx * 0.55; hy = by - bry - hr * 0.45; ang = ps.paws ? 0.5 : 0.25; }
  else if (ps.head === 'down') { hx = bx + brx + p.neck * 0.45 + 1; hy = gy - hr * 0.8; ang = 1.15; }
  else if (ps.head === 'up') { hx = bx + brx * 0.85 + p.neck * 0.45; hy = by - bry - p.neck - hr * 0.1; ang = -0.5; }
  else { hx = bx + brx + p.neck * 0.55; hy = by - bry * 0.5 - p.neck * 0.55 - hr * 0.05; ang = 0.2; }
  if (ps.lie && ps.head !== 'down') { hy += 1; }
  const nb = { x: bx + brx * 0.7, y: by - bry * 0.35 };
  const nsteps = Math.max(6, Math.ceil(Math.hypot(hx - nb.x, hy - nb.y) / 0.9));
  for (let i = 0; i <= nsteps; i++) { const t = i / nsteps; fillBlob(g, nb.x + (hx - nb.x) * t, nb.y + (hy - nb.y) * t, p.neckR + (hr * 0.8 - p.neckR) * t, (p.neckR + (hr * 0.8 - p.neckR) * t) * 0.95, HR, 0.12); }
  fillBlob(g, hx, hy, hr, hr * 0.92, HR, 0.12);
  const sx = hx + Math.cos(ang) * hr * 0.85, sy = hy + Math.sin(ang) * hr * 0.85;
  fillBlob(g, sx, sy, p.snoutR, p.snoutR * 0.82, p.snout || HR, 0.1);
  const tipX = sx + Math.cos(ang) * p.snoutR * 0.8, tipY = sy + Math.sin(ang) * p.snoutR * 0.8;
  g.set(Math.round(tipX), Math.round(tipY), '#1f1410');
  let mouth = { x: Math.round(tipX), y: Math.round(tipY + 1) };
  if (ps.mouth) { for (let k = -1; k <= 1; k++) g.set(Math.round(sx + k), Math.round(sy + p.snoutR * 0.75), '#7a2a30'); mouth = { x: Math.round(sx + 1), y: Math.round(sy + p.snoutR * 0.9) }; }
  // olho
  {
    const k = g.s || 1, ex = Math.round((hx + hr * 0.32) * k), ey = Math.round((hy - hr * 0.2) * k);
    const big = hr * k >= 2.3;
    if (ps.eyesClosed) { g.put(ex, ey, R[0]); if (big) g.put(ex + 1, ey, R[0]); }
    else if (big) { for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) g.put(ex + dx, ey + dy, '#1a0f0a'); g.put(ex, ey, '#ffffff'); }
    else g.put(ex, ey, '#1a0f0a');
    if (big) g.put(ex - 1, ey + 2, '#eea0a4');
  }
  // orelhas
  if (p.ear === 'long') {
    const up = ps.earsUp || ps.tall ? 1 : 0;
    for (const [dx, k] of [[-0.45, 0], [-0.1, 1]]) {
      fillCapsule(g, hx + dx * hr, hy - hr * 0.7, hx + dx * hr - 1.2 + (up ? 0 : -2.2), hy - hr * 0.7 - p.earLen * (up ? 1 : 0.78), 1.35, k ? R : p.earIn || R);
    }
  } else if (p.ear === 'pointy') {
    for (const dx of [-0.45, 0.0]) { const bx2 = hx + dx * hr, by2 = hy - hr * 0.7; for (let r = 0; r < 4; r++) for (let x = -(3 - r) / 2; x <= (3 - r) / 2; x++) g.set(Math.round(bx2 + x), by2 - r, R[dx < -0.2 ? 1 : 2]); g.set(Math.round(bx2), by2 - 1, p.earIn || '#2a1c14'); }
  } else if (p.ear === 'short') {
    fillBlob(g, hx - hr * 0.4, hy - hr * 0.78, 1.8, 1.6, HR, 0.1);
    fillBlob(g, hx - hr * 0.05, hy - hr * 0.85, 1.6, 1.5, HR, 0.1);
  }
  if (p.antlers) {
    const c = p.antlerColor || '#e0d0a8', ox = hx - hr * 0.3, oy = hy - hr * 0.8;
    thickLine(g, ox, oy, ox - 2, oy - 5, 1, () => c); thickLine(g, ox - 2, oy - 5, ox - 5, oy - 9, 1, () => c); thickLine(g, ox - 2, oy - 5, ox + 1, oy - 9, 1, () => c); thickLine(g, ox - 1, oy - 2, ox + 2, oy - 4, 1, () => c);
    thickLine(g, ox + 2, oy, ox + 1, oy - 4, 1, () => c); thickLine(g, ox + 1, oy - 4, ox + 4, oy - 8, 1, () => c);
  }
  if (p.horns) {
    const hx0 = hx - hr * 0.2, hy0 = hy - hr * 0.8;
    thickLine(g, hx0, hy0, hx0 - 3.5, hy0 - 6.5, 1.2, () => '#3a3026'); thickLine(g, hx0 + 1.8, hy0, hx0 - 1.2, hy0 - 6.8, 1.2, () => '#4a3e30');
  }
  // cauda
  const ty = by - bry * 0.3;
  if (p.tail === 'puff') fillBlob(g, bx - brx - 0.5, ty + 1, 2.2, 2.2, p.tailRamp || AR.white, 0.1);
  else if (p.tail === 'short') fillBlob(g, bx - brx - 0.5, ty + 1, 1.8, 1.6, R, 0.1);
  else if (p.tail === 'bushy') { for (let i = 0; i < 6; i++) fillBlob(g, bx - brx - 1 - i * 1.5, ty + 1.5 + i * 0.5, 2.6 - i * 0.12, 2.2, i > 3 ? (p.tailTip || R) : R, 0.12); }
  else if (p.tail === 'long') thickLine(g, bx - brx, ty, bx - brx - 8, ty + 4 + (ps.walk ? 1 : 0), 1.6, (t) => R[t > 0.7 ? 1 : 2]);
  else if (p.tail === 'curl') { thickLine(g, bx - brx, ty + 1, bx - brx - 4, ty + 5, 1.6, () => R[1]); thickLine(g, bx - brx - 4, ty + 5, bx - brx - 8, ty + 2, 1.6, () => R[2]); thickLine(g, bx - brx - 8, ty + 2, bx - brx - 7, ty - 3, 1.6, () => R[1]); }
  if (p.spots) speckle(g, 9, p.spots, p.spotColor || '#3a2410', bx - brx, by - bry, bx + brx, by + bry);
  // patas dianteiras na posição "mãos à boca"
  if (ps.paws) { fillBlob(g, hx + 1.5, hy + hr * 0.9, 1.6, 1.3, p.snout || R, 0.1); fillBlob(g, hx - 0.5, hy + hr * 0.95, 1.4, 1.2, p.snout || R, 0.1); mouth = { x: Math.round(hx + 3), y: Math.round(hy + hr * 0.6) }; }
  addOutline(g, p.outline || '#2a1a10');
  return { g, mouth };
}

/** Ave em pé: corpo, pescoço, bico, asa e pernas; bica o chão ao comer. */
function drawBird(p, frame) {
  const g = newGrid(p.W, p.H);
  const gy = p.H - 2, R = p.fur;
  const walk = frame === 'w0' ? 1 : frame === 'w1' ? 2 : 0;
  const peck = frame === 'eat0' || frame === 'eat1';
  const flap = p.act === 'flap' && (frame === 'act0' || frame === 'act1');
  const bx = p.bx, by = gy - p.legLen - p.bry - (walk === 2 ? 0 : 0) + (frame === 'w1' ? -1 : 0);
  // pernas
  if (p.legLen > 0) for (const [dx, ph] of [[-2.4, walk === 1 ? 1 : -1], [2.4, walk === 1 ? -1 : 1]]) thickLine(g, bx + dx, by + p.bry * 0.6, bx + dx + (walk ? ph * 2.5 : 0), gy, 1, () => p.legColor || '#e08a2a');
  // cauda
  fillBlob(g, bx - p.brx - 1.5, by + 0.5, p.tailLen, p.bry * 0.55, p.tailRamp || R, 0.12);
  fillBlob(g, bx, by, p.brx, p.bry, R, 0.14);
  if (p.belly) blobOn(g, bx + 0.5, by + p.bry * 0.55, p.brx * 0.85, p.bry * 0.45, p.belly, 0.1);
  // pescoço e cabeça
  const nb = { x: bx + p.brx * 0.55, y: by - p.bry * 0.5 };
  let hx = bx + p.brx * 0.7 + 1, hy = by - p.bry - p.neck - p.headR * 0.4;
  let ang = 0;
  if (peck) { hx = bx + p.brx + p.neck * 0.7 + 1; hy = gy - p.headR * 0.7 - (p.legLen > 4 ? 0 : 0); ang = 1.1; }
  else if (p.act === 'preen' && (frame === 'act0' || frame === 'act1')) { hx = bx - 1; hy = by - p.bry * 0.2; ang = frame === 'act1' ? 2.6 : 3.0; }
  const neckR = p.neckR || p.headR * 0.55;
  const bsteps = Math.max(5, Math.ceil(Math.hypot(hx - nb.x, hy - nb.y) / 0.8));
  for (let i = 0; i <= bsteps; i++) { const t = i / bsteps; fillBlob(g, nb.x + (hx - nb.x) * t, nb.y + (hy - nb.y) * t, neckR, neckR, p.neckRamp || R, 0.1); }
  fillBlob(g, hx, hy, p.headR, p.headR, p.headRamp || R, 0.1);
  if (p.crest) fillBlob(g, hx - 1, hy - p.headR - 0.5, 1.6, 2.2, p.crest, 0.1);
  const bl = p.beak, bc = p.beakColor || '#f0c040';
  const bxp = hx + Math.cos(ang) * p.headR * 0.8, byp = hy + Math.sin(ang) * p.headR * 0.8;
  const open = frame === 'eat1' || (frame === 'act1' && p.act === 'call');
  thickLine(g, bxp, byp, bxp + Math.cos(ang) * bl, byp + Math.sin(ang) * bl + (p.beakCurve || 0), p.beakW || 1.6, () => bc);
  if (open) g.set(Math.round(bxp + Math.cos(ang) * bl * 0.6), Math.round(byp + Math.sin(ang) * bl * 0.6 + 1), '#7a2a30');
  {
    const k = g.s || 1, ex = Math.round((hx + Math.cos(ang - 0.7) * p.headR * 0.55) * k), ey = Math.round((hy + Math.sin(ang - 0.7) * p.headR * 0.55) * k);
    if (p.headR * k >= 1.8) { g.put(ex, ey, '#1a0f0a'); g.put(ex + 1, ey, '#1a0f0a'); g.put(ex, ey + 1, '#1a0f0a'); g.put(ex + 1, ey + 1, '#1a0f0a'); g.put(ex, ey, '#ffffff'); }
    else g.put(ex, ey, '#1a0f0a');
  }
  // asa
  if (flap) {
    const up = frame === 'act1';
    for (let i = 0; i < 5; i++) fillBlob(g, bx - 1 - i * 1.4, by - p.bry * (0.4 + i * 0.35) - (up ? 2 : 0), 2.4, 3.2, p.wing || R, 0.12);
    for (let i = 0; i < 3; i++) fillBlob(g, bx - 2 - i * 1.6, by + (up ? -3 : 1) - i * 0.5, 2.8, 2.2, p.wing || R, 0.12);
  } else fillBlob(g, bx - 0.5, by + 0.5, p.brx * 0.75, p.bry * 0.62, p.wing || R, 0.12);
  if (p.speckle) speckle(g, 5, p.speckle[0], p.speckle[1], bx - p.brx, by - p.bry, bx + p.brx, by + p.bry);
  const mouth = { x: Math.round(bxp + Math.cos(ang) * bl), y: Math.round(byp + Math.sin(ang) * bl + 1) };
  addOutline(g, p.outline || '#2a1a10');
  if (p.waterline) { for (let y = Math.floor(by + p.bry * 0.35); y < p.H; y++) for (let x = 0; x < p.W; x++) g.set(x, y, null); addOutline(g, p.outline || '#2a1a10'); }
  return { g, mouth };
}

/** Sapo: pula; ao comer, lança a língua; ao "cantar", infla a garganta. */
function drawFrog(p, frame) {
  const g = newGrid(20, 16);
  const air = frame === 'w1', crouch = frame !== 'w1';
  const by = air ? 7 : 10;
  fillBlob(g, 9, by, 5.5, air ? 3.6 : 4.2, AR.frog, 0.14);
  blobOn(g, 9.5, by + 2, 4.4, 2, [AR.frog[3], AR.frog[3], '#d8e8a8', '#e8f0c0'], 0.1);
  if (air) { thickLine(g, 5, by + 1, 1, by + 4, 2, () => AR.frog[1]); thickLine(g, 13, by + 1, 17, by + 4, 2, () => AR.frog[2]); }
  else { fillBlob(g, 5.5, 12.5, 3.2, 2.2, AR.frog, 0.1); fillBlob(g, 13, 13, 2.2, 1.6, AR.frog, 0.1); }
  fillBlob(g, 14.5, by - 1, 3.2, 2.8, AR.frog, 0.12);
  fillBlob(g, 13.5, by - 4, 1.8, 1.8, AR.frog, 0.1); fillBlob(g, 16.5, by - 3.6, 1.6, 1.6, AR.frog, 0.1);
  g.set(14, by - 4, '#1a0f0a'); g.set(17, by - 4, '#1a0f0a');
  let mouth = { x: 18, y: by };
  if (frame === 'eat1') { for (let k = 0; k < 7; k++) g.set(18 + k, by, '#e0707a'); mouth = { x: 25, y: by }; }
  if (frame === 'act1') fillBlob(g, 16, by + 2.2, 2.6, 2.2, ['#a8742a', '#d0a040', '#e8c860', '#f4e090'], 0.1);
  g.set(15, by, '#2a3a1a');

/** Caranguejo: anda de lado; ao comer, leva as garras à boca; ao "acenar", ergue uma garra. */
function drawCrab(p, frame) {
  const g = newGrid(22, 14);
  const w = frame === 'w1' ? 1 : 0;
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) thickLine(g, 11 + s * 3, 9, 11 + s * (6 + i * 1.5) + (w ? s : 0), 12 - (i % 2 ? 0 : 1), 1, () => AR.crab[1]);
  fillBlob(g, 11, 8, 6.4, 3.8, AR.crab, 0.14);
  const wave = frame === 'act1';
  for (const s of [-1, 1]) {
    const up = (wave && s === 1) || frame === 'eat0' || frame === 'eat1';
    const cx = 11 + s * 7.5, cy = up ? 3 : 6.5;
    thickLine(g, 11 + s * 5, 7, cx, cy + 1.5, 1.6, () => AR.crab[2]);
    fillBlob(g, cx, cy, 2.4, 2.2, AR.crab, 0.1);
    g.set(Math.round(cx), Math.round(cy - 1), AR.crab[0]);
  }
  g.set(9, 4, '#1a0f0a'); g.set(13, 4, '#1a0f0a'); g.set(9, 3, AR.crab[2]); g.set(13, 3, AR.crab[2]);
  addOutline(g, '#3a0e08');
  return { g, mouth: { x: 11, y: 6 } };
}

/** Lagarto: corpo comprido; ao "tomar sol", faz flexões. */
function drawLizard(p, frame) {
  const g = newGrid(30, 14);
  const w = frame === 'w1' ? 1 : frame === 'w0' ? -1 : 0;
  const up = frame === 'act1';
  const by = up ? 6 : 8;
  thickLine(g, 3, by + 2, 11, by + 1, 3.4, (t, dx, dy) => AR.lizard[dy < 0 ? 2 : 1]);
  thickLine(g, 11, by + 1, 21, by, 4, (t, dx, dy) => AR.lizard[dy < 0 ? 3 : 2]);
  thickLine(g, 3, by + 2, 0, by + 4, 1.4, () => AR.lizard[1]);
  fillBlob(g, 23.5, by - (up ? 1.5 : 0), 3.4, 2.6, AR.lizard, 0.12);
  fillBlob(g, 26, by + 0.5 - (up ? 1.5 : 0), 2, 1.6, AR.lizard, 0.1);
  g.set(24, by - 1 - (up ? 1 : 0), '#1a0f0a');
  for (const [lx, far] of [[18, true], [20, false], [7, true], [9, false]]) {
    const off = (lx > 14 ? w : -w);
    thickLine(g, lx, by + 2, lx + 2 + off, up && lx > 14 ? 12 : 12, 1.2, () => AR.lizard[far ? 0 : 1]);
  }
  speckle(g, 3, 10, AR.lizard[0], 4, by - 2, 20, by + 3);
  let mouth = { x: 28, y: by + 1 };
  if (frame === 'eat0' || frame === 'eat1') { fillBlob(g, 26.5, by + 2.5, 2, 1.6, AR.lizard, 0.1); mouth = { x: 28, y: by + 4 }; }
  if (frame === 'eat1') g.set(28, by + 2, '#7a2a30');
  addOutline(g, '#3a2a10');
  return { g, mouth };
}

/** Foca: corpo roliço que desliza; ao comer, ergue a cabeça com um peixe. */
function drawSeal(p, frame) {
  const g = newGrid(40, 18);
  const w = frame === 'w1' ? 1 : 0;
  const up = frame === 'eat0' || frame === 'eat1' || frame === 'act1';
  fillBlob(g, 18, 12 - w, 13, 4.8, AR.seal, 0.14);
  thickLine(g, 4, 13 - w, 0, 11 - w, 3, () => AR.seal[1]);
  thickLine(g, 1, 11 - w, 0, 8 - w, 1.6, () => AR.seal[1]);
  fillBlob(g, 29, up ? 6 : 9, 3.8, 3.6, AR.seal, 0.12);
  fillBlob(g, 32.5, up ? 7 : 10, 2.2, 1.7, ['#8a94a4', '#a8b2c0', '#c4ccd8', '#dde3ea'], 0.1);
  g.set(33, up ? 6 : 9, '#1a0f0a'); g.set(30, up ? 4 : 7, '#1a0f0a'); g.set(32, up ? 4 : 7, '#1a0f0a');
  fillBlob(g, 25, 15, 2.6, 1.4, AR.seal, 0.1);
  speckle(g, 11, 14, AR.seal[0], 6, 8, 26, 15);
  if (frame === 'act0') for (const [x, y] of [[19, 7], [20, 6]]) g.set(x, y, AR.seal[3]);
  addOutline(g, '#262c38');

/** Lê um item da lista de itens e desenha seus pixels perto da boca. */
function drawItem(ctx, kind, x, y, flip) {
  const px = ITEM_PIXELS[kind];
  if (!px) return;
  for (const [c, dx, dy] of px) { ctx.fillStyle = c; ctx.fillRect(x + (flip ? -dx : dx), y + dy, 1, 1); }
}

const RB_F = ['#5e4230', '#8a6444', '#b48a5c', '#d4ae80'];
const RB_CR = ['#d2b48c', '#e4cba6', '#f0dcc0', '#fbf0dc'];
const RB_WH = ['#c8ccd8', '#e0e4ec', '#f4f6fa', '#ffffff'];
const RB_OLD = ['#6a5a50', '#8e8070', '#b4a898', '#d4ccc0'];
const RB_OLD_CR = ['#c4baae', '#d6cec2', '#e6e0d6', '#f4f0e8'];
/** Lebre-da-neve: pelo branco-azulado. */
const HARE_F = ['#9aa6b8', '#bcc6d4', '#dde3ec', '#f6f8fc'];
const HARE_CR = ['#dde3ec', '#eaeff5', '#f4f7fb', '#ffffff'];

/**
 * Desenha um quadro do coelho (olhando para a direita) em escala `s`.
 * Filhote: menor, cabeça grande; idoso: pelo grisalho.
 * @param {string} frame idle | w0 | w1 | eat0 | eat1 | act0 | act1 @param {number} s @param {boolean} kit @param {boolean} old @param {'brown'|'white'} [pal] pelagem (coelho marrom ou lebre branca)
 */
function drawBunnyS(frame, s, kit, old, pal = 'brown') {
  const W = 16, H = 19, gy = 17, g = new ScaledGrid(W, H, s);
  const white = pal === 'white', F = old ? RB_OLD : white ? HARE_F : RB_F, CR = old ? RB_OLD_CR : white ? HARE_CR : RB_CR, WH = RB_WH;
  const PINK = '#f09aa0', INNER = '#f4b4b4', EYE = '#2a1818';
  const P = (v) => Math.round(v * s), hs = kit ? 1.2 : 1, bs = kit ? 0.85 : 1;
  const ear = (bx, by, tx, ty) => {
    fillCapsule(g, bx, by, tx, ty, 1.25, F);
    thickLine(g, bx + (tx - bx) * 0.12, by + (ty - by) * 0.12, bx + (tx - bx) * 0.5, by + (ty - by) * 0.5, 1, () => INNER);
  };
  const face = (hx, hy, puff) => {
    fillBlob(g, hx, hy, 3.5 * hs, 3.1 * hs, F, 0.1);
    if (puff) fillBlob(g, hx + 0.4, hy + 1.6, 2.9 * hs, 2.1 * hs, F, 0.1);
    fillBlob(g, hx + 2.3 * hs, hy + 1.3 * hs, 1.5, 1.2, CR, 0.1);
    g.put(P(hx + 3.7 * hs), P(hy + 0.6 * hs), PINK);
    const ex = P(hx + 0.9 * hs), ey = P(hy - 1.4 * hs);
    const eye = s >= 0.85 ? [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2], [1, 2]] : [[0, 0], [1, 0], [0, 1], [1, 1]];
    for (const [dx, dy] of eye) g.put(ex + dx, ey + dy, EYE);
    g.put(ex, ey, '#ffffff');
    if (s >= 0.7) g.put(P(hx - 0.4), P(hy + 1.9 * hs), INNER);
  };
  const tail = (x, y) => fillBlob(g, x, y, 1.6, 1.6, WH, 0.1);
  let head;
  if (frame === 'w0') {
    thickLine(g, 5, gy - 3.4, 2.2, gy - 0.5, 2, () => CR[1]);
    fillBlob(g, 5.4, gy - 3.8, 3.2 * bs, 3 * bs, F, 0.1);
    fillBlob(g, 8.8, gy - 3.4, 3.8 * bs, 2.6 * bs, F, 0.1);
    thickLine(g, 12, gy - 2.2, 14.2, gy - 0.6, 1.6, () => CR[1]);
    tail(2.4, gy - 5.4);
    head = [12.2, gy - 5.2];
    ear(head[0] - 1.2, head[1] - 2, head[0] - 5.4, head[1] - 4.6); ear(head[0] + 0.3, head[1] - 2.3, head[0] - 3.6, head[1] - 5.2);
    face(head[0], head[1], false);
  } else if (frame === 'w1') {
    thickLine(g, 4, gy - 8, 0.8, gy - 5.8, 1.8, () => CR[1]);
    thickLine(g, 11.5, gy - 7, 15.2, gy - 5.4, 1.6, () => CR[1]);
    fillBlob(g, 5.6, gy - 8.4, 3.4 * bs, 2.8 * bs, F, 0.1);
    fillBlob(g, 9.6, gy - 8.6, 3.4 * bs, 2.6 * bs, F, 0.1);
    tail(2.2, gy - 9.6);
    head = [12.6, gy - 9.6];
    ear(head[0] - 1.2, head[1] - 2, head[0] - 6, head[1] - 3.2); ear(head[0] + 0.3, head[1] - 2.3, head[0] - 4.4, head[1] - 3.8);
    face(head[0], head[1], false);
  } else if (frame === 'act0' || frame === 'act1') {
    fillBlob(g, 6.4, gy - 3.4, 3.4 * bs, 3.2 * bs, F, 0.1);
    fillBlob(g, 8, gy - 6.6, 2.7 * bs, 3.6 * bs, F, 0.1);
    fillBlob(g, 7.2, gy - 0.8, 2.8, 0.9, CR, 0.1);
    tail(3.2, gy - 4.4);
    head = [8.8, gy - 10.6];
    ear(head[0] - 1.1, head[1] - 2, head[0] - 1.6, head[1] - 6.6);
    ear(head[0] + 0.8, head[1] - 2.2, head[0] + (frame === 'act1' ? 2.6 : 0.9), head[1] - (frame === 'act1' ? 5.8 : 6.8));
    face(head[0], head[1], false);
    fillBlob(g, head[0] + 1.4, head[1] + 3.6, 1.3, 1.0, CR, 0.1); fillBlob(g, head[0] - 0.2, head[1] + 3.8, 1.2, 0.9, CR, 0.1);
  } else {
    const eating = frame === 'eat0' || frame === 'eat1';
    fillBlob(g, 5.4, gy - 2.8, 3.2 * bs, 2.7 * bs, F, 0.1);
    fillBlob(g, 7.8, gy - 3.0, 2.5 * bs, 2.5 * bs, F, 0.1);
    fillBlob(g, 7, gy - 0.6, 2.2, 0.8, CR, 0.1);
    tail(2.2, gy - 3.4);
    head = eating ? [10.6, gy - 3.6] : [9.8, gy - 6.2];
    if (eating) { ear(head[0] - 1.2, head[1] - 2, head[0] - 4.2, head[1] - 5.6); ear(head[0] + 0.3, head[1] - 2.3, head[0] - 1.8, head[1] - 6); }
    else { ear(9, gy - 8.2, 7.9, gy - 12.6); ear(10.8, gy - 8.4, 10.9, gy - 12.8); }
    face(head[0], head[1], frame === 'eat1');
    fillBlob(g, head[0] + 1.6, gy - 1.2, 1.2, 0.9, CR, 0.1);
  }
  addOutline(g, '#4a3220');
  return { g, mouth: { x: P(head[0] + 3.6), y: P(head[1] + 1.6) } };
}
